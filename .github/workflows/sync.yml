name: Sync TBC Data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  sync:
    name: Fetch TBC feeds and relay to production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @available-player-portal/shared

      - name: Fetch feeds and relay to production ingest
        working-directory: apps/api
        env:
          TBC_FEED_PASSWORD: ${{ secrets.TBC_FEED_PASSWORD }}
          TBC_HTTPS_PROXY: ${{ secrets.TBC_HTTPS_PROXY }}
          SYNC_INTERNAL_KEY: ${{ secrets.SYNC_INTERNAL_KEY }}
          REMOTE_SYNC_INGEST_URL: https://www.alpb-analytics.com/widgets/player-portal/api/sync/ingest-raw
        run: npx tsx src/jobs/localRelaySync.ts
