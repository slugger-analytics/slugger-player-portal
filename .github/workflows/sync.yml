name: Sync TBC Data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  sync:
    name: Fetch TBC feeds and relay to production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @available-player-portal/shared

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-2
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: player-portal-sync-relay

      - name: Fetch feeds, upload to S3, and call ingest-raw
        working-directory: apps/api
        env:
          TBC_FEED_PASSWORD: ${{ secrets.TBC_FEED_PASSWORD }}
          TBC_HTTPS_PROXY: ${{ secrets.TBC_HTTPS_PROXY }}
          SYNC_INTERNAL_KEY: ${{ secrets.SYNC_INTERNAL_KEY }}
          FEED_S3_BUCKET: alpb-player-portal-sync
          REMOTE_SYNC_INGEST_URL: https://www.alpb-analytics.com/widgets/player-portal/api/sync/ingest-raw
          SYNC_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
        run: npx tsx src/jobs/localRelaySync.ts
